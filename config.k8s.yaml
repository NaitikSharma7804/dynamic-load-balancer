
server:
  host: 0.0.0.0
  port: 8080

admin:
  host: 0.0.0.0
  port: 9090

proxy:
  algorithm: round_robin
  connect_timeout_s: 1.0
  request_timeout_s: 5.0
  retry_count: 1

health:
  interval_s: 2.0
  timeout_s: 1.0
  unhealthy_threshold: 3
  healthy_threshold: 2
  slow_start_s: 10

backends:
  - name: b1
    host: backend-b1
    port: 5001
    weight: 5
    delay_ms: 50
  - name: b2
    host: backend-b2
    port: 5002
    weight: 3
    delay_ms: 100
  - name: b3
    host: backend-b3
    port: 5003
    weight: 1
    delay_ms: 200
