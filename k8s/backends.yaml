
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-backends
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-backends
  template:
    metadata:
      labels:
        app: demo-backends
    spec:
      containers:
        - name: backends
          image: naitik7804/dynamic-load-balancer:latest
          imagePullPolicy: Always
          command: ["python", "/app/k8s-backend-start.py"]
          ports:
            - containerPort: 5001
            - containerPort: 5002
            - containerPort: 5003
---
apiVersion: v1
kind: Service
metadata:
  name: backend-b1
spec:
  selector:
    app: demo-backends
  ports:
    - port: 5001
      targetPort: 5001
---
apiVersion: v1
kind: Service
metadata:
  name: backend-b2
spec:
  selector:
    app: demo-backends
  ports:
    - port: 5002
      targetPort: 5002
---
apiVersion: v1
kind: Service
metadata:
  name: backend-b3
spec:
  selector:
    app: demo-backends
  ports:
    - port: 5003
      targetPort: 5003
